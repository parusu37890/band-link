              - text: 新規ロックバンドのドラムを 募集しています。 現在ベース(女)、ギター(男)、 ボーカル(女)と スタッフでカメラマンの子がたまに撮影などしにきてくれます！ メンバー全員30代前半です。 私が作曲担当していまして 各パート各々元の曲からアレンジして演奏してもらうという形になっています。 活動はまだまだ これからという形なのですが YouTubeメインでしばらくやって その後ライブもできれば少しずつしていきたいと思っています。 スタジオは京都で 最低月1で基本的には月2(2週に一回)くらいの頻度で日中に 入ります。 プロ思考でがちがちにするって感じではなく楽しく音楽を長く続けて一緒に上達していきたいなと思っています！ ご興味があればご連絡ください！ オリジナル曲は下記URLから聞いてみてください
