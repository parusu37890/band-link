spring:
  application:
    name: band-link
  # SMTPの接続先は環境変数から受け取り、資格情報はリポジトリに置かない。
  # MAIL_HOST が未設定のあいだは送信を行わず、警告だけ残す（MailService）。
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:band_link}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # Spring's own defaults (1MB per file, 10MB per request) are well under what
  # ImageStorageService/PostImageService actually allow (5MB per file, up to 4 per post - worst
  # case 20MB) - any file over 1MB was rejected before it ever reached our code, with no message
  # the frontend could show. Sized above the app-level caps so ImageStorageService's own 5MB check
  # is what fires, with its normal message, not this generic multipart limit (see
  # ApiExceptionHandler for the backstop for a request that still exceeds this).
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 25MB
  # Sessions were in-memory only, so a deploy's fresh container silently logged every signed-in
  # person out even though the cookie itself was set to last 90 days. Storing them in the same
  # Postgres database the app already has means a session outlives a restart. Schema is created by
  # SessionSchemaInitializer (idempotent, matches this project's no-Flyway pattern) rather than
  # Spring Boot's own initialize-schema=always, whose bundled script has no IF NOT EXISTS and would
  # fail on the second startup.
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  output:
    ansi:
      enabled: never

logging:
  structured:
    format:
      console: ecs
      # The collector tails this file rather than the app pushing to Elasticsearch directly:
      # if Elasticsearch is down the app keeps writing and the collector catches up later
      # (requirements 13.3 asks for the failure behaviour to be decided).
      file: ecs
  file:
    name: logs/band-link.ecs.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    org.hibernate.SQL: WARN

server:
  servlet:
    session:
      # Login sessions remain available for 90 days of inactivity so users do not
      # have to authenticate again every time they reopen the browser.
      timeout: 90d
      cookie:
        max-age: 90d
        # SEC-014: neither attribute was set anywhere, so JSESSIONID relied entirely on
        # Tomcat/Spring Boot defaults - confirmed live (Set-Cookie: JSESSIONID=...; Path=/;
        # HttpOnly, nothing else). HttpOnly was already present by default; same-site was not,
        # so it depended on the browser's own default-Lax behaviour rather than being explicit.
        # secure defaults false so local/QA runs over plain HTTP keep working (a Secure cookie is
        # simply dropped by the browser over HTTP) and is meant to be set true via env var once
        # this runs behind real HTTPS (see app.base-url's ${APP_BASE_URL:...} for the same pattern).
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  security:
    # SEC-013: caps POST attempts per remote address+endpoint across the anonymous auth surface
    # (login/verify/reset), independent of LoginAttemptService's per-email lockout in AuthService -
    # this stops a single IP hammering many different accounts, which a per-email counter alone
    # would not catch.
    auth-rate-limit:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  # 認証・復旧メールの差出人と、本文に載せる画面のURL（requirements 7章）。
  # mail-from が空、または spring.mail.host が空のあいだは送信しない。
  mail-from: ${MAIL_FROM:}
  # お問い合わせ・機能要望が届いた時の通知先。未設定のあいだは通知メールを送らない（DB保存のみ）。
  admin-email: ${ADMIN_EMAIL:}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # GA4の測定ID（例: G-XXXXXXXXXX）。未設定のあいだはトラッキングスクリプトを出力しない。
  google-analytics-id: ${GOOGLE_ANALYTICS_ID:}
  upload-dir: uploads/profile-images
  post-upload-dir: uploads/post-images
  message-upload-dir: uploads/message-images
  line:
    # LINE Login credentials and callback URL are supplied only through environment variables.
    channel-id: ${LINE_CHANNEL_ID:}
    channel-secret: ${LINE_CHANNEL_SECRET:}
    redirect-uri: ${LINE_REDIRECT_URI:}
