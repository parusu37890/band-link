spring:
  application:
    name: band-link
  # SMTPの接続先は環境変数から受け取り、資格情報はリポジトリに置かない。
  # MAIL_HOST が未設定のあいだは送信を行わず、警告だけ残す（MailService）。
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: jdbc:postgresql://localhost:5432/band_link
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  output:
    ansi:
      enabled: never

logging:
  structured:
    format:
      console: ecs
      # The collector tails this file rather than the app pushing to Elasticsearch directly:
      # if Elasticsearch is down the app keeps writing and the collector catches up later
      # (requirements 13.3 asks for the failure behaviour to be decided).
      file: ecs
  file:
    name: logs/band-link.ecs.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    org.hibernate.SQL: WARN

app:
  # 認証・復旧メールの差出人と、本文に載せる画面のURL（requirements 7章）。
  # mail-from が空、または spring.mail.host が空のあいだは送信しない。
  mail-from: ${MAIL_FROM:}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: uploads/profile-images
  post-upload-dir: uploads/post-images
  message-upload-dir: uploads/message-images
  line:
    # LINE Login credentials and callback URL are supplied only through environment variables.
    channel-id: ${LINE_CHANNEL_ID:}
    channel-secret: ${LINE_CHANNEL_SECRET:}
    redirect-uri: ${LINE_REDIRECT_URI:}
