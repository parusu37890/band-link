spring:
  application:
    name: band-link
  datasource:
    url: jdbc:postgresql://localhost:5432/band_link
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  output:
    ansi:
      enabled: never

logging:
  structured:
    format:
      console: ecs
      # The collector tails this file rather than the app pushing to Elasticsearch directly:
      # if Elasticsearch is down the app keeps writing and the collector catches up later
      # (requirements 13.3 asks for the failure behaviour to be decided).
      file: ecs
  file:
    name: logs/band-link.ecs.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    org.hibernate.SQL: WARN

app:
  upload-dir: uploads/profile-images
  post-upload-dir: uploads/post-images
  message-upload-dir: uploads/message-images
