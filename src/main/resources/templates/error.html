<!--
  Spring Boot's DefaultErrorViewResolver automatically renders this template (by
  convention: templates/error.html) for any error whose response the browser
  negotiates as HTML, instead of the framework's own unstyled "Whitelabel Error
  Page". Before this file existed, ANY page-like URL not explicitly listed in
  PageController (a stale bookmark, a typo, a dead link from an old share) served
  that raw whitelabel page: no Band Link header/footer, no background token at
  all - exactly the "unintended white surface" ST-055 checks every route for.

  This is a byte-for-byte copy of posts.html's shell (not a distinct error UI):
  loading it re-runs the same client-side router, which already has its own
  fallback for a path it doesn't recognize (redirect to /posts, see app.js). API
  requests (Accept: application/json) are unaffected - Spring Boot's content
  negotiation keeps serving JSON error bodies for those regardless of this file.
-->

<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">

  <title>Band Link — 募集・加入希望の掲示板</title>
  <link rel="icon" type="image/svg+xml" href="/assets/mark.svg?v=20260913-1">
  <link rel="stylesheet" href="/css/app.css?v=20260915-6">
  <script type="module" src="/js/app.js?v=20260915-3"></script>
</head>
<body>

  <footer class="site-footer"><a class="wordmark" href="/"><img class="brand-mark" src="/assets/mark.svg?v=20260913-1" alt=""><span>Band Link</span></a><p>募集・加入希望</p><a href="/support">ヘルプ</a><span class="copyright">© Band Link</span></footer>
