<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Band Link</title><style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#20232a}header{padding:24px 8%;background:#161a24;color:#fff}main{max-width:960px;margin:40px auto;padding:0 20px}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 18px #0001;margin:16px 0}input{padding:11px;border:1px solid #ddd;border-radius:8px;width:70%}button{background:#5567e8;color:#fff;border:0;padding:10px 18px;border-radius:8px}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}</style></head><body><header><strong>Band Link</strong><span style="float:right">バンド仲間を見つけよう</span></header><main><div class="card"><h1>募集を探す</h1><p>音楽ジャンルや活動エリアから、あなたに合う仲間を探せます。</p><input id="keyword" placeholder="キーワード"><button onclick="loadPosts()">検索</button></div><section id="results"></section></main><script>async function loadPosts(){const q=document.getElementById('keyword').value;const r=await fetch('/api/posts?keyword='+encodeURIComponent(q));const posts=await r.json();document.getElementById('results').innerHTML=posts.map(p=>`<article class="card"><h2>${p.title}</h2><p>${p.content}</p><small>${p.username} ・ ${p.status}</small></article>`).join('')||'<p>募集はありません。</p>';}loadPosts();</script></body></html>
